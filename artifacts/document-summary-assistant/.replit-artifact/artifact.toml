kind = "web"
previewPath = "/"
title = "Document Summary Assistant"
description = "A focused document workspace that lets candidates upload PDFs or images, extract readable content, generate summaries at three depths, and review key points and improvement suggestions."
version = "1.0.0"
id = "artifacts/document-summary-assistant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22293

[services.development]
run = "pnpm --filter @workspace/document-summary-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/document-summary-assistant", "run", "build" ]
serve = "static"
publicDir = "artifacts/document-summary-assistant/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22293"
BASE_PATH = "/"
